<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>larry-june</title>
  </head>
  <body>

    <section class="preloader">
      <div class="middle">
        <svg width="500" height="500" viewBox="0 0 120 120">
          <circle id="loader-circle"
                  cx="60"
                  cy="60"
                  r="50"
                  stroke="white"
                  stroke-width="3"
                  fill="none"
                  stroke-linecap="round"
          />
        </svg>

        <div class="preloader-text">
          <h1 >Keep Going!</h1>
        </div>

      </div>
      <div id="percent">0%</div>

     

    </section>

    <div id="app">

     

      <main class="scroll">
 

      <header class="main-top">
        <div class="header-container">
          <a class="header-text" href="/">
            <span>LARRY</span>
            
          </a>
        </div>
       
        <nav class="navigation">
          <ul class="tabs-desktop">
            <li class="tab tab1">Larry</li>
            <li class="tab tab2">Music</li>
            <li class="tab tab3">Fashion</li>
            <li class="tab">Tap In</li>


          </ul>
        </nav>
      </header>
      <section class="back" id="BGVIDEO">
        <video class="video" muted="" autoplay="" loop="" playsinline="" webkit-playsinline="" src="./public/test.mp4"></video>
        <video class="video-preloader" muted="" loop="" playsinline="" webkit-playsinline="" preload="none" src=""></video>      
      </section>
      <section class="modal-container">
        <div>
          <div class="donut">
            <div class="hole"></div>
            <div class='bigger-hole'>
              <div class="line-container">
                <div class="line"></div>
              </div>
            </div>
           
  
  
  
  
            <div class="slice slice1">
              <img id="ples" src="/pleasant.jpg" alt="First Song">
            </div>
            <div class="slice slice2">
              <img src="/feelme.jpg" alt="Second Song">
  
            </div>
            <div class="slice slice3">
              <img src="/solidplan.jpg" alt="Third Song">
  
            </div>
            <div class="slice slice4">
              <img src="/days.jpg" alt="Fourth Song">
  
            </div>
  
          </div>
          <div class="line-container">
            <div class="line"></div>
          </div>

        
        </div>

        
        
      </section>
      <section class="video-play-interface">
        <div class="screen-controls">
           

        </div>
        <div class="video-info">
          <div class="left">
            <h1 class="title"></h1>
            <ul class="important-things">
              <li class="producer"></li>
              <li class="director"></li>
              <li class="artist"></li>
              <li class="location"></li>
            </ul>
          </div>
          <div class="vid-progress">
            <div class="scrubber">
              <div class="track"></div>
              <div class="thumb"></div>
            </div>
          </div>
          <div class="right">
            <button class="right-pause" data-play>Play</button>
            <button data-pause="">Pause</button>
            <button class="volume">
              Sound
              <span style="display: none;" data-on>On</span>
              <span data-off>Off</span>

            </button>
            <a href="/">Exit</a>
          </div>
        </div>
      </section>

      </main>
    
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
